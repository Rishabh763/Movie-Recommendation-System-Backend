name: Refresh Recommendations

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours UTC
  workflow_dispatch:  # allows manual run from GitHub

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call protected refresh endpoint
        env:
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
        run: |
          # --max-time covers Render's free-tier cold start; -f fails the job on 4xx/5xx
          curl -fsS --max-time 120 -X POST \
            -H "X-Refresh-Token: ${REFRESH_SECRET}" \
            https://movie-recommendation-system-backend-m2xt.onrender.com/refresh
